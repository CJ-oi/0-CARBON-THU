name: 更新并发布园区碳观察

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/archive.jsonl"
      - "data/archive_manifest.json"
      - "data/source_health.json"
      - "outputs/source_sync_log.json"
      - "outputs/build_manifest.json"
  workflow_dispatch:
    inputs:
      skip_sync:
        description: "仅使用当前档案构建，不访问公开来源"
        required: false
        default: false
        type: boolean
  schedule:
    # UTC；北京时间每 6 小时的第 17 分钟检查一次。
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zero-carbon-park-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码与上一版档案
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装项目与报告渲染工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . playwright
          python -m playwright install --with-deps chromium

      - name: 初始化滚动档案
        run: zcpark init

      - name: 检查公开来源并增量合并
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_sync == true) }}
        run: zcpark sync --sleep 0.3

      - name: 运行数据、核算和报告测试
        run: python -m unittest discover -s tests -v

      - name: 构建网站、分析报告与可行性报告
        run: zcpark build --output site --feasibility-input data/assessments/example.json

      - name: 生成参考界面截图与 PDF 报告
        run: python scripts/capture_and_render.py --site site

      - name: 发布质量门禁
        run: zcpark validate --site site

      - name: 浏览器功能验收
        run: python scripts/browser_smoke_test.py --site site --output outputs/browser_smoke_test.json

      - name: JavaScript 语法检查
        run: |
          node --check static/app.js
          node --check services/report-mailer/src/index.js

      - name: 保存滚动档案与来源健康
        shell: bash
        run: |
          git config user.name "park-observer-bot"
          git config user.email "park-observer-bot@users.noreply.github.com"
          git add -A -- data/archive.jsonl data/archive_manifest.json data/source_health.json outputs/source_sync_log.json outputs/build_manifest.json
          if git diff --cached --quiet; then
            echo "No public archive changes to commit"
          else
            git commit -m "data: update public archive [skip ci]"
            git push origin HEAD:main
          fi

      - name: 保存本次合格数据与报告快照
        uses: actions/upload-artifact@v4
        with:
          name: zero-carbon-park-publish-snapshot
          path: |
            site/data
            site/reports
            site/assets/report_screenshots
            outputs/source_sync_log.json
            outputs/build_manifest.json
            outputs/browser_smoke_test.json
          retention-days: 14

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
